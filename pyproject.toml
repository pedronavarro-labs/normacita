[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normacita"
version = "0.2.0"
description = "Asistente de normativa técnica con citas verificables (RAG). Proyecto TFM - Máster en Desarrollo con IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
normacita = ["api/static/*"]

# ---------- Calidad ----------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/F: errores básicos · I: orden de imports · B: bugs comunes · UP: sintaxis moderna
# S: reglas de seguridad (bandit) · SIM: simplificaciones · N: nombres PEP8
select = ["E", "F", "I", "B", "UP", "S", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # en tests, assert es lo normal

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=normacita --cov-report=term-missing"
