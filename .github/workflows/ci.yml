name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # mínimo privilegio para el token de Actions

jobs:
  calidad-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (sin claves de API, proveedor fake)
        env:
          LLM_PROVIDER: fake
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: calidad-y-tests
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t normacita:ci .
      - name: Smoke test del contenedor
        run: |
          docker run -d --name app -p 8000:8000 normacita:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
